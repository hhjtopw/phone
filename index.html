    if(ui.paste.mode==='replace')S.chat.messages=ms;else S.chat.messages=M.concat(ms);
    ui.paste.text='';renderEditor();commit();toast(`${ms.length}개 말풍선을 만들었어요 (나 ${ms.filter(m=>m.side==='right').length} · 상대 ${ms.filter(m=>m.side==='left').length})`);},
  dup:el=>{const a=g(el.dataset.path),i=+el.dataset.i;if(!a||!a[i])return;const c=JSON.parse(JSON.stringify(a[i]));if(c.id!=null)c.id=uid();a.splice(i+1,0,c);renderEditor();commit();toast('바로 아래에 복제했어요');},
  itemFold:el=>{const it=el.closest('.item');if(!it)return;const k=it.dataset.fkey;ui.itemFold[k]=!it.classList.contains('folded');it.classList.toggle('folded',!!ui.itemFold[k]);},
  foldAll:el=>{const cd=el.closest('.card');if(!cd)return;const v=el.dataset.val==='1';cd.querySelectorAll('.item[data-fkey]').forEach(it=>{ui.itemFold[it.dataset.fkey]=v;it.classList.toggle('folded',v);});},
  copyChat:()=>{const nm=(S.chat&&(S.chat.name||S.chat.title))||'상대';copyText((S.chat.messages||[]).map(m=>`${m.side==='right'?'나':nm}: ${m.text||(m.img&&m.img.url?'(사진)':'')}`).join('\n'));},
  copyTweets:()=>{const T=S.tl,ts=T[T.tab?'tweetsF':'tweets']||[];copyText(ts.map(t=>`${t.name} ${t.handle}${t.time?' · '+t.time:''}\n${t.text||''}${t.q&&t.q.on&&t.q.text?`\n[인용] ${t.q.name} ${t.q.handle}: ${t.q.text}`:''}`).join('\n\n'));},
});

/* ═════ v7 : 사이드바 · 맨 위로 ═════ */
const DR_TABS=[['device','화면 · 기기','<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>'],['export','저장 · 프로젝트','<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'],['extra','추가 기능','<path d="M12 3l1.9 5.1L19 10l-5.100 1.900L12 17l-1.900-5.100L5 10l5.100-1.900z"/>']];
const DR_QA=[['copy','복사','<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'],['png','PNG','<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 16l4-4 4 4 3-3 5 5"/>'],['play','미리보기','<path d="M8 5l11 7-11 7z"/>'],['gif','GIF','<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 10.500H7a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1h1v-1.200M12 10v4M15 14v-4h2.500M15 12h2"/>'],['vid','영상','<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>']];
ui.drOpen=ui.drOpen||null;
// 왼쪽 메뉴(화면 고르기) 다시 그리기
function renderDrawer(){
  const cur=S.screen,curG=(SCREEN_GROUPS.find(([g,ks])=>ks.includes(cur))||[])[0];
  if(!ui.drOpen)ui.drOpen={};
  if(ui.drOpen._init!==curG){ui.drOpen._init=curG;if(curG)ui.drOpen[curG]=true;}
  const ico=k=>(typeof UI==='object'&&UI[k])?UI[k]:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M11 18h2"/></svg>';
  const sv=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const q=(ui.drQ||'').trim();
  const groups=SCREEN_GROUPS.map(([gl,ks])=>{
    const list=ks.filter(k=>!q||screenLabel(k).toLowerCase().includes(q.toLowerCase()));
    if(!list.length)return'';
    const open=q?true:!!ui.drOpen[gl];
    return`<section class="dr-g${open?' open':''}"><button class="dr-gh" data-act="drgrp" data-val="${esc(gl)}"><span>${esc(gl)}</span><em>${ks.length}</em><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button><div class="dr-grid">${list.map(k=>`<button class="dr-t2${(ui.tab==='screen'&&cur===k)?' on':''}" data-act="dscreen" data-val="${k}"><i>${ico(k)}</i><span>${esc(screenLabel(k))}</span></button>`).join('')}</div></section>`;
  }).join('');
  $('#drBody').innerHTML=`<div class="dr-now"><small>지금 편집 중</small><b>${esc(screenLabel(cur))}</b></div>
  <label class="dr-s"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.500"/><path d="M16 16l4.500 4.500"/></svg><input id="drQ" type="search" placeholder="화면 검색 (예: 카톡, 유튜브)" value="${esc(ui.drQ||'')}" autocomplete="off"></label>
  <div class="dr-t">화면 목차</div>${groups||'<div class="dr-empty">검색 결과가 없어요</div>'}
  <div class="dr-t">내보내기</div><div class="dr-qa">${DR_QA.map(([k,l,d])=>`<button data-act="dqa" data-val="${k}" class="${k==='vid'?'pri':''}">${sv(d)}<span>${l}</span></button>`).join('')}</div>
  <div class="dr-t">설정</div>${DR_TABS.map(([k,l,d])=>`<button class="dr-i ${ui.tab===k?'on':''}" data-act="dtab" data-val="${k}">${sv(d)}${l}</button>`).join('')}`;
  const inp=$('#drQ');if(inp)inp.addEventListener('input',()=>{ui.drQ=inp.value;const pos=inp.selectionStart;renderDrawer();const n=$('#drQ');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}});
}
// 왼쪽 메뉴 열기/닫기
function drawerOpen(v){document.body.classList.toggle('dr-on',v);$('#drawer').setAttribute('aria-hidden',v?'false':'true');if(v)renderDrawer();}
Object.assign(ACT,{
  drawer:()=>drawerOpen(!document.body.classList.contains('dr-on')),
  drawerClose:()=>drawerOpen(false),
  dtab:el=>{ui.tab=el.dataset.val;ui.drQ='';drawerOpen(false);renderEditor();scrollTopNow(true);},
  dscreen:el=>{ui.tab='screen';ui.drQ='';S.screen=el.dataset.val;ui.gsel=-1;drawerOpen(false);renderEditor();commit();scrollTopNow(true);},
  toTop:()=>scrollTopNow(false),
  drgrp:el=>{const k=el.dataset.val;ui.drOpen[k]=!ui.drOpen[k];renderDrawer();},
  dqa:el=>{const t=document.querySelector(`.acts [data-act="${el.dataset.val}"]`);drawerOpen(false);if(t)setTimeout(()=>t.click(),260);},
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')drawerOpen(false);});
// 편집 패널(PC) / 페이지(모바일)를 맨 위로 올리기
function scrollTopNow(instant){const b=instant?'auto':'smooth';const pn=$('.panel');if(pn)pn.scrollTo({top:0,behavior:b});window.scrollTo({top:0,behavior:b});document.body.scrollTo({top:0,behavior:b});document.documentElement.scrollTo({top:0,behavior:b});}
(function(){
  const btn=$('#qbar'),pn=$('.panel');let last=0,lastW=0;
  const cur=()=>Math.max(pn?pn.scrollTop:0,window.scrollY||0,document.documentElement.scrollTop||0,document.body.scrollTop||0);
  let tick=0;                                    // 스크롤 이벤트는 프레임당 한 번만 처리해요 (가볍게)
  function update(){
    tick=0;
    const y=cur(),d=y-last;
    if(y<160)btn.classList.add('on');            // 맨 위 근처에서도 보여요
    else if(d<-6)btn.classList.add('on');        // 살짝 위로 올리면 나타나고
    else if(d>6)btn.classList.remove('on');      // 아래로 내리면 숨어요
    last=y;
  }
  function onScroll(e){
    const t=e&&e.target;if(t&&t!==document&&t!==pn&&t!==document.body&&t!==document.documentElement)return;
    if(!tick)tick=requestAnimationFrame(update);
  }
  pn&&pn.addEventListener('scroll',onScroll,{passive:true});
  window.syncQbar=()=>btn.querySelectorAll('.qr button').forEach(b=>b.classList.toggle('on',b.dataset.val===((S.device&&S.device.ratio)||'phone')));
  const _re=renderEditor;renderEditor=function(){const r=_re.apply(this,arguments);syncQbar();return r;};syncQbar();btn.classList.add('on');
  window.addEventListener('scroll',onScroll,{passive:true});
  document.body.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',()=>{if(window.innerWidth!==lastW){lastW=window.innerWidth;fit();}});
  lastW=window.innerWidth;
})();
renderEditor();renderPreview();
IDB.get(KEY).then(raw=>{if(!raw){try{if(localStorage.getItem('chat-video-rnd'))return;rndFill(true).then(n=>{if(n)localStorage.setItem('chat-video-rnd','1');});}catch(e){}return;}try{S=merge(defaults(),JSON.parse(raw));fixupState();ui.gsel=-1;renderEditor();renderPreview();}catch(e){console.warn('저장본 읽기 실패',e);}}).catch(e=>console.warn('IndexedDB 사용 불가',e));
if(document.fonts)document.fonts.ready.then(fit);
/* v8 : 둥실 효과 온오프 (설정 > 기기) */
(function(){const _rp=renderPreview;const sync=()=>{const d=S.device||{};document.body.classList.toggle('nofloat',d.float===false);document.body.classList.toggle('i26',d.ios26!==false);};renderPreview=function(){sync();return _rp.apply(this,arguments);};sync();})();
/* v8 : 마우스를 따라 폰이 살짝 기울어져요 (미리보기 전용 · 저장에는 영향 없음) */
(function(){
  const v=document.getElementById('view'),p=document.getElementById('preview');
  if(!v||!p||!matchMedia('(pointer:fine) and (prefers-reduced-motion:no-preference)').matches)return;
  let raf=0,rx=0,ry=0;
  const apply=()=>{raf=0;p.style.setProperty('--rx',rx.toFixed(2)+'deg');p.style.setProperty('--ry',ry.toFixed(2)+'deg');};
  const go=()=>{if(!raf)raf=requestAnimationFrame(apply);};
  v.addEventListener('pointermove',e=>{const r=v.getBoundingClientRect();ry=((e.clientX-r.left)/r.width-.5)*10;rx=-((e.clientY-r.top)/r.height-.5)*6;go();});
  v.addEventListener('pointerleave',()=>{rx=ry=0;go();});
})();
</script>
